[package]
name = "news_portal"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
axum-extra = { version = "0.9", features = ["form"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header"] }
tower-sessions = "0.13"
tower-sessions-sqlx-store = { version = "0.14", features = ["mysql"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "migrate", "macros"] }
askama = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
jsonwebtoken = "9"
chrono = "0.4"
dotenvy = "0.15"
rand = "0.8"
ammonia = "4"

moka = { version = "0.12", features = ["future"] }
bytes = "1"
